<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Whisper</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">

        <div id="model-download" class="d-none">
            <p class="mb-1">Downloading model...</p>
            <div class="progress">
                <div id="download-progress-bar"
                     class="progress-bar progress-bar-striped progress-bar-animated"
                     role="progressbar"
                     style="width: 0%"
                     aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                    0%
                </div>
            </div>
        </div>

        <div id="file-picker" class="d-none">
            <label for="audio-file" class="form-label">Please select the file to transcribe</label>
            <input type="file" id="audio-file" class="form-control" accept="audio/*,video/*">
            <button id="transcribe-btn" class="btn btn-primary mt-3 d-none">Transcribe</button>
            <a id="download-btn" class="btn btn-success mt-3 d-none" download="subtitles.srt">Download .srt</a>
        </div>

    </div>

    <script src="coi-serviceworker.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/ui.js"></script>
</body>
</html>
